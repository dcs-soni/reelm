mode: auto
listen_addr: ":8080"
admin_addr: ":8081"
cassette_dir: "./cassettes"
cassette_format: "yaml"
default_timeout: 120s

providers:
  - name: openai
    base_url: "https://api.openai.com"
    path_prefix: "/v1"
    headers:
      - "Authorization"
      - "OpenAI-Organization"
      - "OpenAI-Project"
    strip_auth: true
  - name: anthropic
    base_url: "https://api.anthropic.com"
    path_prefix: "/v1/messages"
    headers:
      - "x-api-key"
      - "anthropic-version"
      - "anthropic-beta"
    strip_auth: true
  - name: gemini
    base_url: "https://generativelanguage.googleapis.com"
    path_prefix: "/v1beta"
    headers:
      - "x-goog-api-key"
    strip_auth: true

streaming:
  replay_mode: "instant"

tls:
  enabled: true
  ca_dir: ""

matching:
  fuzzy_enabled: false
  similarity_threshold: 0.92
  max_candidates: 100

log:
  level: "info"
  format: "console"
